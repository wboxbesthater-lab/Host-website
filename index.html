<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Hack - v8 Installer</title>
    <style>
        :root {
            --bg-color: #0b0b1a;
            --panel-bg: #15152f;
            --accent-color: #00d4ff;
            --text-color: #e0e0e0;
            --border-glow: rgba(0, 212, 255, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Ambient Background Blur */
        .bg-blur {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-color);
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            width: 450px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px var(--border-glow);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #fff;
            text-transform: uppercase;
        }

        .version-tag {
            font-size: 12px;
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent-color);
        }

        .status-box {
            margin: 30px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-size: 14px;
            border-left: 4px solid var(--accent-color);
            text-align: left;
        }

        .progress-container {
            height: 8px;
            width: 100%;
            background: #252545;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d4ff, #0055ff);
            box-shadow: 0 0 10px var(--accent-color);
            transition: width 0.5s ease;
        }

        .btn-install {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        .btn-install:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn-install:active {
            transform: translateY(0);
        }

        .footer-links {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.6;
        }

        .footer-links a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 10px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <div class="container">
        <div class="header">
            <h1>MEGA HACK</h1>
            <span class="version-tag">v8.0.0 PRO</span>
        </div>

        <div class="status-box">
            <div><strong>Status:</strong> Ready to install</div>
            <div style="margin-top: 5px; font-size: 12px; opacity: 0.8;">Geometry Dash detected in: <br> <i>C:/Program Files (x86)/Steam/steamapps/common/Geometry Dash</i></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="bar"></div>
        </div>

        <button class="btn-install" onclick="startInstall()">Install Extension</button>

        <div class="footer-links">
            <a href="#">Discord</a> • <a href="#">Documentation</a> • <a href="#">Settings</a>
        </div>
    </div>

    <script>
        function startInstall() {
            const bar = document.getElementById('bar');
            const btn = document.querySelector('.btn-install');
            let width = 0;
            
            btn.disabled = true;
            btn.innerText = "Installing...";
            btn.style.background = "#555";

            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    btn.innerText = "Installation Complete";
                    btn.style.background = "#2ecc71";
                } else {
                    width += Math.random() * 5;
                    if(width > 100) width = 100;
                    bar.style.width = width + "%";
                }
            }, 100);
        }
    </script>
</body>
</html>
