<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Hack Installer</title>
    <style>
        body {
            background-color: #0d0b1e;
            color: #b388ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 450px;
            background-color: #0d0b1e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);

        .header-row {

            align-items: center;
            justify-content: flex-start;

            color: white;

            padding: 2px 5px;
            font-size: 0.9em;
        }

        h1 {

            font-size: 2.2em;
            margin: 10px 0 30px 0;
            color: #8c6eff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .label {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            justify-content: center;
        }

        input[type="text"], select {
            background-color: #16122b;
            border: 1px solid #332d5a;
            color: #d1d1d1;
            padding: 8px;
            width: 320px;
            outline: none;
        }

        .browse-btn {
            background-color: #5e35b1;
            color: white;
            border: none;
            padding: 0 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .checkbox-container {
            margin: 20px 0;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .install-btn {
            background: linear-gradient(to bottom, #9575cd, #7e57c2);
            color: white;
            border: none;
            padding: 15px 60px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        .install-btn:hover {
            background: linear-gradient(to bottom, #b39ddb, #9575cd);
        }

        .status {
            color: #00e676;
            margin-top: 20px;
            font-weight: bold;
        }

        .logo {

</html>
